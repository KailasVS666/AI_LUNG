seed: 42

data:
  splits_path: /kaggle/working/AI_LUNG/outputs/splits/patient_split.json
  hu_min: -1000
  hu_max: 400
  patch_size: [64, 64, 64]   # 64³ voxel patches
  patches_per_volume:
    train: 20
    val: 10
  noise_std: 0.03             # Fallback if no denoised vols
  # Path to .npy denoised volumes saved by export_denoised.py
  denoised_vol_dir: /kaggle/working/outputs/denoised_vols
  max_cases_per_split:
    train: null
    val: null

model:
  base_channels: 16
  l1_weight: 1.0
  ssim_weight: 0.5
  grad_weight: 0.2
  proj_weight: 0.1

train:
  batch_size: 4
  num_workers: 4
  epochs: 30
  learning_rate: 0.0002
  weight_decay: 0.00001
  output_dir: /kaggle/working/outputs/train_runs/recon3d

runtime:
  device: auto
  mixed_precision: true
